services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qr_user
      POSTGRES_PASSWORD: qr_password
      POSTGRES_DB: qr_codes
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr_user -d qr_codes"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
